      <section class="music-section" id="music">

            ←

            <div class="music-art-lg" id="mpArtWrap"></div>

              <button class="music-close" id="mpClose">[ close ]</button>
              <h3 id="mpTitle"></h3>
              <p class="music-artist" id="mpArtist"></p>
              <div class="music-controls" id="mpControls">
                <button class="music-play-btn" id="mpPlayBtn">[ PLAY ]</button>
                <span class="music-time" id="mpTime">0:00 / 0:00</span>
              </div>
              <input
                class="music-progress"
                id="mpProgress"
                type="range"
                min="0"
                max="100"
                value="0"
                step="0.1"
              />
              <audio id="mpAudio"></audio>
              <div id="mpSpotify"></div>
            </div>
          </div>
        </div>

    <script>
      (function () {
        function isMobile() {
          return window.matchMedia("(max-width: 900px)").matches;
        }
        document.querySelectorAll(".exp-img-card").forEach(function (card) {
          card.addEventListener("click", function (e) {
            if (!isMobile()) return;
            var wasActive = card.classList.contains("overlay-active");
            document
              .querySelectorAll(".exp-img-card.overlay-active")
              .forEach(function (c) {
                c.classList.remove("overlay-active");
              });
            if (!wasActive) {
              card.classList.add("overlay-active");
              e.preventDefault();
            }
          });
        });
      })();
    </script>

        var viewport = document.getElementById("musicShelfViewport");
        var shelf = document.getElementById("musicShelf");
        var player = document.getElementById("musicPlayer");
        var mpArtWrap = document.getElementById("mpArtWrap");
        var mpTitle = document.getElementById("mpTitle");
        var mpArtist = document.getElementById("mpArtist");
        var mpPlayBtn = document.getElementById("mpPlayBtn");
        var mpTime = document.getElementById("mpTime");
        var mpProgress = document.getElementById("mpProgress");
        var mpAudio = document.getElementById("mpAudio");
        var mpClose = document.getElementById("mpClose");
        var mpSpotify = document.getElementById("mpSpotify");
        var mpControls = document.getElementById("mpControls");

        var activeId = null;
        var pos = 0;
        var vel = 0;
        var maxScroll = 0;
        var mouseOver = false;
        var raf = null;
        var mobileIdx = 0;

        var arrowLeft = document.getElementById("shelfArrowLeft");
        var arrowRight = document.getElementById("shelfArrowRight");

        function isMobile() {
          return window.matchMedia("(max-width: 900px)").matches;
        }

        function fmt(s) {
          if (isNaN(s) || !isFinite(s)) return "0:00";
          var m = Math.floor(s / 60);
          var sec = Math.floor(s % 60);
          return m + ":" + (sec < 10 ? "0" : "") + sec;
        }

        function buildArtEl(t, large) {
          if (large) {
            if (t.art) {
              var img = document.createElement("img");
              img.src = t.art;
              img.alt = t.title;
              var wrap = document.createElement("div");
              wrap.style.cssText = "width:100%;height:100%;";
              wrap.appendChild(img);
              return wrap;
            }
            var ph = document.createElement("div");
            ph.className = "album-placeholder";
            ph.style.backgroundColor = t.color;
            var pttl = document.createElement("span");
            pttl.className = "album-placeholder-title";
            pttl.textContent = t.title;
            var patr = document.createElement("span");
            patr.className = "album-placeholder-artist";
            patr.textContent = t.artist;
            ph.appendChild(pttl);
            ph.appendChild(patr);
            return ph;
          }

          var face = document.createElement("div");
          face.className = "album-face";
          if (!t.art) face.style.backgroundColor = t.color;

          if (t.art) {
            var img = document.createElement("img");
            img.src = t.art;
            img.alt = t.title;
            face.appendChild(img);
          }

          var spine = document.createElement("span");
          spine.className = "album-spine-title";
          spine.textContent = t.title;

          var info = document.createElement("div");
          info.className = "album-face-info";
          var fttl = document.createElement("span");
          fttl.className = "album-face-title";
          fttl.textContent = t.title;
          var fatr = document.createElement("span");
          fatr.className = "album-face-artist";
          fatr.textContent = t.artist;
          info.appendChild(fttl);
          info.appendChild(fatr);
          face.appendChild(spine);
          face.appendChild(info);
          return face;
        }

        TRACKS.forEach(function (t) {
          var div = document.createElement("div");
          div.className = "album";
          div.dataset.idx = t.id;
          div.appendChild(buildArtEl(t, false));
          shelf.appendChild(div);
          div.addEventListener("click", function () {
            openTrack(t);
          });
        });

        function init() {
          maxScroll = -(shelf.offsetWidth - viewport.offsetWidth);
          pos = 0;
          shelf.style.transform = "translateX(0px)";
          if (isMobile()) {
            setMobileFocus(0);
            updateArrows();
          }
        }
        requestAnimationFrame(function () {
          requestAnimationFrame(init);
        });

        function tick() {
          pos = Math.min(0, Math.max(maxScroll, pos + vel));
          shelf.style.transform = "translateX(" + pos + "px)";
          if (mouseOver) {
            raf = requestAnimationFrame(tick);
          } else {
            raf = null;
          }
        }

        viewport.addEventListener("mouseenter", function () {
          if (isMobile()) return;
          mouseOver = true;
          if (!raf) raf = requestAnimationFrame(tick);
        });

        viewport.addEventListener("mousemove", function (e) {
          if (isMobile()) return;
          var rect = viewport.getBoundingClientRect();
          var t = (e.clientX - rect.left - rect.width / 2) / (rect.width / 2);
          var dead = 0.18;
          if (Math.abs(t) < dead) {
            vel = 0;
          } else {
            var s = (Math.abs(t) - dead) / (1 - dead);
            vel = -Math.sign(t) * s * s * 9;
          }
        });

        viewport.addEventListener("mouseleave", function () {
          if (isMobile()) return;
          mouseOver = false;
          vel = 0;
        });

        function setMobileFocus(idx) {
          shelf.querySelectorAll(".album.shelf-focused").forEach(function (el) {
            el.classList.remove("shelf-focused");
          });
          var albums = shelf.querySelectorAll(".album");
          if (albums[idx]) albums[idx].classList.add("shelf-focused");
        }

        function updateArrows() {
          arrowLeft.disabled = mobileIdx <= 0;
          arrowRight.disabled = mobileIdx >= TRACKS.length - 1;
        }

        function navigateMobile(dir) {
          mobileIdx = Math.max(0, Math.min(TRACKS.length - 1, mobileIdx + dir));
          setMobileFocus(mobileIdx);

          var vpW = viewport.offsetWidth;
          var step = 44 + 6;
          var faceW = 148;
          var target = -(mobileIdx * step) + (vpW - faceW) / 2;
          pos = Math.min(0, Math.max(maxScroll, target));

          shelf.classList.add("shelf-animated");
          shelf.style.transform = "translateX(" + pos + "px)";
          setTimeout(function () {
            shelf.classList.remove("shelf-animated");
          }, 320);

          updateArrows();
        }

        arrowLeft.addEventListener("click", function () {
          navigateMobile(-1);
        });
        arrowRight.addEventListener("click", function () {
          navigateMobile(1);
        });

        function setActiveAlbums(id) {
          shelf.querySelectorAll(".album.active").forEach(function (el) {
            el.classList.remove("active");
          });
          if (id !== null) {
            shelf
              .querySelectorAll(".album[data-idx='" + id + "']")
              .forEach(function (el) {
                el.classList.add("active");
              });
          }
        }

        function openTrack(t) {
          if (activeId === t.id && player.classList.contains("open")) {
            closePlayer();
            return;
          }
          setActiveAlbums(null);
          shelf.querySelectorAll(".album.shelf-focused").forEach(function (el) {
            el.classList.remove("shelf-focused");
          });
          activeId = t.id;
          setActiveAlbums(t.id);

          mpArtWrap.innerHTML = "";
          mpArtWrap.appendChild(buildArtEl(t, true));
          mpTitle.textContent = t.title;
          mpArtist.textContent = t.artist;
          mpAudio.pause();
          mpAudio.removeAttribute("src");
          mpAudio.load();
          mpSpotify.innerHTML = "";

          if (t.spotifyId) {
            mpControls.style.display = "none";
            mpProgress.style.display = "none";
            var iframe = document.createElement("iframe");
            iframe.src = "https://open.spotify.com/embed/track/" + t.spotifyId;
            iframe.width = "100%";
            iframe.height = "80";
            iframe.frameBorder = "0";
            iframe.allow =
              "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
            iframe.setAttribute("allowtransparency", "true");
            mpSpotify.appendChild(iframe);
            var warn = document.createElement("p");
            warn.className = "spotify-volume-warn";
            warn.textContent = "// heads up: spotify embeds can be loud";
            mpSpotify.appendChild(warn);
          } else {
            mpControls.style.display = "";
            mpProgress.style.display = "";
            if (t.src) {
              mpAudio.src = t.src;
              mpAudio.load();
            }
            mpPlayBtn.textContent = "[ PLAY ]";
            mpProgress.value = 0;
            mpTime.textContent = "0:00 / 0:00";
          }


          player.classList.add("open");
          setTimeout(function () {
            player.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }, 50);
        }

        function closePlayer() {
          player.classList.remove("open");
          setActiveAlbums(null);
          shelf.querySelectorAll(".album.shelf-focused").forEach(function (el) {
            el.classList.remove("shelf-focused");
          });
          activeId = null;
          mpAudio.pause();
          mpAudio.removeAttribute("src");
          mpAudio.load();
          mpPlayBtn.textContent = "[ PLAY ]";
          mpSpotify.innerHTML = "";
          mpControls.style.display = "";
          mpProgress.style.display = "";
        }

        mpClose.addEventListener("click", closePlayer);

        mpPlayBtn.addEventListener("click", function () {
          if (!mpAudio.getAttribute("src")) return;
          if (mpAudio.paused) {
            mpAudio.play();
            mpPlayBtn.textContent = "[ PAUSE ]";
          } else {
            mpAudio.pause();
            mpPlayBtn.textContent = "[ PLAY ]";
          }
        });

        mpAudio.addEventListener("timeupdate", function () {
          if (!mpAudio.duration) return;
          mpProgress.value = (mpAudio.currentTime / mpAudio.duration) * 100;
          mpTime.textContent =
            fmt(mpAudio.currentTime) + " / " + fmt(mpAudio.duration);
        });

        mpAudio.addEventListener("ended", function () {
          mpPlayBtn.textContent = "[ PLAY ]";
          mpProgress.value = 0;
        });

        mpProgress.addEventListener("input", function () {
          if (!mpAudio.duration) return;
          mpAudio.currentTime = (mpProgress.value / 100) * mpAudio.duration;
        });
      })();
    </script>
